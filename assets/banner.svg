<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Jev Lite — Local System-One Decision API and Confidence Cascade">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.32"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#334155" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Emblem: Two-order confidence gate & cascade -->
  <g transform="translate(76, 56)">
    <rect x="0" y="0" width="188" height="188" rx="26" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Two-order input branches -->
    <path d="M 28 62 H 68 L 86 94" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 126 H 68 L 86 94" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="28" cy="62" r="5" fill="#38bdf8"/>
    <circle cx="28" cy="126" r="5" fill="#34d399"/>
    <text x="24" y="49" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">(a,b)</text>
    <text x="24" y="147" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">(b,a)</text>

    <!-- Gate diamond -->
    <polygon points="94,70 118,94 94,118 70,94" fill="#0f172a" stroke="url(#accent)" stroke-width="2.8"/>
    <text x="94" y="99" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">τ</text>

    <!-- Accept path (top) -->
    <path d="M 118 94 H 134 L 146 62 H 164" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="164" cy="62" r="7" fill="#10b981"/>
    <path d="M 161 62 L 163.5 64.5 L 168 59.5" fill="none" stroke="#062016" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Escalate path (bottom) -->
    <path d="M 118 94 H 134 L 146 126 H 164" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <circle cx="164" cy="126" r="7" fill="#f59e0b"/>
    <text x="164" y="130" text-anchor="middle" fill="#1c1917" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800">8B</text>

    <!-- Calibration bars at bottom -->
    <rect x="34" y="160" width="22" height="6" rx="3" fill="#334155"/>
    <rect x="62" y="160" width="38" height="6" rx="3" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="106" y="160" width="48" height="6" rx="3" fill="#34d399"/>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(306, 98)">
    <rect x="0" y="-26" width="218" height="24" rx="12" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="14" y="-10" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.06em">SYSTEM-ONE DECISION API</text>

    <text x="0" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.03em">Jev Lite</text>
    <text x="2" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Typed logprob decisions, two-order confidence gating, and local Ollama cascade.</text>

    <!-- Pills -->
    <g transform="translate(0, 118)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="124" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="62" y="18" text-anchor="middle" fill="#e2e8f0">Python stdlib</text>

      <rect x="136" y="0" width="142" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="207" y="18" text-anchor="middle" fill="#7dd3fc">qwen3:4b → 8b</text>

      <rect x="290" y="0" width="136" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="358" y="18" text-anchor="middle" fill="#6ee7b7">T=6.0 · τ=0.95</text>

      <rect x="438" y="0" width="150" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="513" y="18" text-anchor="middle" fill="#fcd34d">100% held-out</text>
    </g>
  </g>
</svg>
